spring:
  application:
    name: aurora-server
  autoconfigure:
    exclude:
      # aurora-mall 引入了 redisson-spring-boot-starter 为未来分布式锁准备，但目前电商模块
      # 还没有代码使用 Redisson。Redisson 自动配置在启动时会强制连接 Redis 并发送 AUTH，
      # 与本地无密码 Redis 不兼容；同时它创建的 RedisTemplate 是 <Object,Object>，与业务代码
      # 需要的 <String,Object> 泛型不匹配。当 aurora-mall 真正需要 Redisson 时，移除此排除即可。
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
  datasource:

    url: jdbc:mysql://localhost:3306/aurora?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:6}
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: 1207
  servlet:
    context-path: /api

springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.aurora

knife4j:
  enable: true
  setting:
    language: zh_cn

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: assign_id
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:/mapper/**/*.xml

# Sa-Token 配置（Phase 1 登录鉴权）
sa-token:
  token-name: Authorization        # token 名称，请求头 key
  timeout: 2592000                  # token 有效期 30 天（秒）
  active-timeout: -1                # 临时有效期（指定时间内无操作就过期），-1 永不过期
  is-concurrent: true               # 是否允许同一账号并发登录
  is-share: false                   # 多人登录时是否共用一个 token（false=每人一个）
  token-style: uuid                 # token 风格
  is-log: false                     # 关闭 sa-token 内部日志
  is-read-cookie: false             # 前后端分离：不从 cookie 读 token
  is-read-header: true              # 从 header 读 token
  token-prefix: Bearer              # token 前缀（要求 header: Authorization: Bearer xxx）

# AURORA 业务配置
aurora:
  captcha:
    expire-seconds: 120             # 验证码有效期（秒）
    key-prefix: "aurora:captcha:"          # Redis 存验证码的 key 前缀
  ai:
    embedding:
      enabled: ${AURORA_EMBEDDING_ENABLED:false}
      provider-mode: ${AURORA_EMBEDDING_PROVIDER_MODE:local}
      cloud-consent: ${AURORA_EMBEDDING_CLOUD_CONSENT:false}
      base-url: ${AURORA_EMBEDDING_BASE_URL:}
      api-key: ${AURORA_EMBEDDING_API_KEY:}
      model: ${AURORA_EMBEDDING_MODEL:}
      dimension: ${AURORA_EMBEDDING_DIMENSION:0}
      timeout-seconds: ${AURORA_EMBEDDING_TIMEOUT_SECONDS:60}
  jackson:
    big-number-mode: string       # flexible=超出JS安全范围才转String | string=所有Long一律转String
